<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="shopify-api-key" content="__SHOPIFY_API_KEY__" />
    <title>kando1 Bulk Pricing MVP</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  </head>
  <body>
    <main class="wrap">
      <h1 data-i18n="appTitle">Bulk Pricing Rule Builder</h1>

      <section class="usageMeter card" id="usageMeter" aria-live="polite">
        <div>
          <div class="usagePlan" id="usagePlan">Plan</div>
          <div class="usageHeadline" id="usageHeadline"></div>
        </div>
        <div class="usageBars">
          <div>
            <div class="usageBarLabel" id="usageTasksLabel"></div>
            <div class="usageBar"><span id="usageTasksBar"></span></div>
          </div>
          <div>
            <div class="usageCapLabel" id="usageVariantsLabel"></div>
          </div>
        </div>
        <a id="usageUpgrade" class="usageUpgrade" href="/billing/upgrade?plan=standard" target="_top" rel="noopener" data-i18n="upgradeButton">Upgrade</a>
      </section>

      <section class="card">
        <div id="shopSection" class="hidden">
          <label data-i18n="shopDomainLabel">Shop Domain</label>
          <div class="row">
            <input id="shop" placeholder="example.myshopify.com" />
            <button id="connectShop" type="button" data-i18n="connectButton">Connect</button>
          </div>
          <div id="shopStatus" class="hint"></div>
        </div>

        <label data-i18n="productIdLabel">Product ID</label>
        <div class="row">
          <input id="productId" data-i18n-placeholder="productIdPlaceholder" placeholder="Pick product or paste gid://shopify/Product/123" />
          <button id="pickProduct" type="button" data-i18n="pickProductButton">Pick product</button>
        </div>
        <div id="productInfo" class="hint"></div>

        <div class="row between">
          <h2 data-i18n="rulesHeading">Rules</h2>
          <button id="addRule" type="button" data-i18n="addRuleButton">+ Rule</button>
        </div>

        <div class="featureActions" aria-label="Pro feature previews">
          <button id="scheduleToggle" type="button" class="secondary" data-i18n="scheduleButton">Schedule</button>
          <button id="saveTemplate" type="button" class="secondary" data-i18n="saveTemplateButton">Save as template</button>
          <button id="olderHistory" type="button" class="secondary" data-i18n="olderHistoryButton">Older history</button>
        </div>

        <div id="rules"></div>

        <div id="paywall" class="paywall hidden"></div>

        <div class="row">
          <button id="simulate" type="button" data-i18n="previewButton">Preview</button>
          <button id="apply" type="button" class="warn" data-i18n="applyButton">Apply</button>
        </div>
      </section>

      <section class="card" id="summary"></section>
      <section class="card" id="result"></section>
    </main>

    <template id="ruleTpl">
      <div class="rule">
        <div class="row">
          <label>Priority</label>
          <input class="priority" type="number" value="1" />
          <button type="button" class="remove">x</button>
        </div>

        <div class="conditions"></div>
        <button type="button" class="addCondition">+ Condition</button>

        <div class="row">
          <label>Action</label>
          <select class="actionType">
            <option value="add">add</option>
            <option value="set">set</option>
            <option value="multiply">multiply</option>
          </select>
          <input class="actionValue" type="number" step="0.01" value="0" />
        </div>
      </div>
    </template>

    <template id="conditionTpl">
      <div class="condition">
        <div class="row">
          <select class="field">
            <option value="option1">option1</option>
            <option value="option2">option2</option>
            <option value="title">title</option>
          </select>
          <select class="op">
            <option value="equals">equals</option>
            <option value="contains">contains</option>
            <option value="startsWith">startsWith</option>
            <option value="in">in (multi-select)</option>
          </select>
          <input class="value" placeholder="value" />
          <button type="button" class="pickValues hidden">Pick</button>
          <button type="button" class="removeCondition">x</button>
        </div>
        <div class="valuePicker hidden">
          <div class="pickerMeta"></div>
          <div class="pickerList"></div>
        </div>
      </div>
    </template>

    <div id="softPaywallModal" class="modalBackdrop hidden" role="dialog" aria-modal="true" aria-labelledby="softPaywallTitle">
      <div class="modalCard">
        <h2 id="softPaywallTitle"></h2>
        <p id="softPaywallBody"></p>
        <div class="row">
          <a id="softPaywallUpgrade" class="modalPrimary" href="/billing/upgrade?plan=pro" target="_top" rel="noopener"></a>
          <button id="softPaywallClose" type="button" data-i18n="notNowButton">Not now</button>
        </div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
