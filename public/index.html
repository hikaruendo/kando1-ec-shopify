<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kando1 Bulk Pricing MVP</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Bulk Pricing Rule Builder (MVP)</h1>

      <section class="card">
        <label>Shop Domain</label>
        <div class="row">
          <input id="shop" placeholder="example.myshopify.com" />
          <button id="connectShop" type="button">Connect</button>
        </div>
        <div id="shopStatus" class="hint"></div>

        <label>Product ID</label>
        <input id="productId" value="gid://shopify/Product/123" />

        <div class="row between">
          <h2>Rules</h2>
          <button id="addRule" type="button">+ Rule</button>
        </div>

        <div id="rules"></div>

        <div class="row">
          <button id="simulate" type="button">Preview</button>
          <button id="apply" type="button" class="warn">Apply</button>
        </div>
      </section>

      <section class="card" id="summary"></section>
      <section class="card" id="result"></section>
    </main>

    <template id="ruleTpl">
      <div class="rule">
        <div class="row">
          <label>Priority</label>
          <input class="priority" type="number" value="1" />
          <button type="button" class="remove">x</button>
        </div>

        <div class="conditions"></div>
        <button type="button" class="addCondition">+ Condition</button>

        <div class="row">
          <label>Action</label>
          <select class="actionType">
            <option value="add">add</option>
            <option value="set">set</option>
            <option value="multiply">multiply</option>
          </select>
          <input class="actionValue" type="number" step="0.01" value="0" />
        </div>
      </div>
    </template>

    <template id="conditionTpl">
      <div class="condition">
        <div class="row">
          <select class="field">
            <option value="option1">option1</option>
            <option value="option2">option2</option>
            <option value="title">title</option>
          </select>
          <select class="op">
            <option value="equals">equals</option>
            <option value="contains">contains</option>
            <option value="startsWith">startsWith</option>
            <option value="in">in (multi-select)</option>
          </select>
          <input class="value" placeholder="value" />
          <button type="button" class="pickValues hidden">Pick</button>
          <button type="button" class="removeCondition">x</button>
        </div>
        <div class="valuePicker hidden">
          <div class="pickerMeta"></div>
          <div class="pickerList"></div>
        </div>
      </div>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
