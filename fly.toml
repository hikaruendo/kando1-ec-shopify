app = "kando1-bulk-pricing"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8787"
  SHOPIFY_SCOPES = "read_products,write_products"
  SHOPIFY_API_VERSION = "2025-01"
  MOCK_MODE = "false"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
